{% extends "base.html" %}

{% block title %}Reading: {{ issue.title }} &middot; Unmad Digital Archive{% endblock %}

{% comment %}
================================================================================
Reader page -- renders the PDF via PDF.js (Mozilla) into <canvas> elements.

WHY PDF.JS RATHER THAN <iframe src=".pdf">:
  The native browser handler is out of our control -- it obeys per-user
  settings ("Download PDFs instead of opening them in Chrome", Edge's
  "Always download PDFs", any installed PDF extension, etc.) which override
  the server's Content-Disposition: inline. PDF.js sidesteps this entirely:
  the browser only sees a fetch() returning bytes, and we paint pixels onto
  <canvas>. No handler, no download prompt, ever.

ANTI-PIRACY NOTE:
  select-none + oncontextmenu + ondragstart on the wrapper are PSYCHOLOGICAL
  deterrents against casual Save-As. They do NOT stop DevTools, the Network
  tab (which still exposes /pdf/), View-Source, or screenshots. For real
  anti-piracy you want per-user watermarking baked into the PDF before
  streaming, or a DRM'd viewer -- both much larger projects.
================================================================================
{% endcomment %}

{% block extra_head %}
    {# PDF.js core, version-pinned. Bump PDFJS_WORKER_SRC in the driver script below in lockstep with this URL. #}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
{% endblock %}

{% block content %}

<div
    id="unmad-reader-root"
    class="select-none"
    oncontextmenu="return false;"
    ondragstart="return false;"
    onselectstart="return false;"
    data-pdf-url="{% url 'issue_pdf' slug=issue.slug %}"
    data-issue-title="{{ issue.title }}"
>

    {# Reader chrome: back link, title, page counter, zoom controls, lock badge. #}
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-200">
        <div class="min-w-0">
            <a href="{{ issue.get_absolute_url }}"
               class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-indigo-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
                Back to issue
            </a>
            <h1 class="mt-1 text-lg sm:text-xl font-semibold tracking-tight text-slate-900 truncate">
                {{ issue.title }}
                <span class="text-slate-400 font-normal">#{{ issue.issue_number }}</span>
            </h1>
        </div>

        <div class="flex items-center gap-3 text-xs text-slate-500">
            {# Page counter: populated by JS once the document loads. #}
            <span id="pdf-page-counter" class="hidden sm:inline" aria-live="polite">
                <span id="pdf-page-current">&ndash;</span> / <span id="pdf-page-total">&ndash;</span>
            </span>

            {# Zoom controls. Disabled until doc loads. #}
            <div class="flex items-center gap-1" role="group" aria-label="Zoom controls">
                <button type="button" id="pdf-zoom-out" disabled
                        class="w-7 h-7 flex items-center justify-center rounded border border-slate-300 text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                        aria-label="Zoom out">&minus;</button>
                <button type="button" id="pdf-zoom-reset" disabled
                        class="px-2 h-7 text-xs rounded border border-slate-300 text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                        aria-label="Reset zoom">Fit</button>
                <button type="button" id="pdf-zoom-in" disabled
                        class="w-7 h-7 flex items-center justify-center rounded border border-slate-300 text-slate-600 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                        aria-label="Zoom in">+</button>
            </div>

            <span class="hidden md:inline-flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4 text-indigo-600">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
                Protected reader
            </span>
        </div>
    </div>

    {# Loading state: shown while PDF.js downloads + parses the document. #}
    <div id="pdf-status" class="py-16 text-center" role="status" aria-live="polite">
        <svg class="animate-spin mx-auto h-8 w-8 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        <p id="pdf-status-text" class="mt-3 text-sm text-slate-600">Loading PDF&hellip;</p>
    </div>

    {# Error state: shown if the fetch or parse fails. Initially hidden. #}
    <div id="pdf-error" class="hidden py-12 text-center" role="alert">
        <p id="pdf-error-text" class="text-sm text-rose-700 font-medium">The PDF couldn't be loaded.</p>
        <p class="mt-1 text-xs text-slate-500">Your session may have expired, or the file is temporarily unavailable.</p>
        <button type="button" onclick="window.location.reload();"
                class="mt-3 inline-block text-sm text-indigo-600 hover:text-indigo-500 underline">
            Refresh and try again
        </button>
    </div>

    {# Page container: JS creates one slot per PDF page, each containing a <canvas>. #}
    <div id="pdf-container"
         class="hidden space-y-4 bg-slate-100 p-2 sm:p-4 rounded-lg border border-slate-200 shadow-inner">
    </div>

    {# Footer: status only. The reader is the only sanctioned way to view this PDF. #}
    <p class="mt-4 text-xs text-slate-500">
        Reading issue #{{ issue.issue_number }} of {{ issue.title }}.
    </p>

</div>

{% comment %}
============================================================================
PDF.js driver script.

Strategy:
  1. Kick off getDocument() with a progress callback -> drives the loader UI.
  2. Once we know numPages + first page dimensions, pre-create N "slot" divs
     at the correct aspect ratio so the scrollbar is stable from the start.
  3. Use IntersectionObserver to render each page's canvas lazily, only when
     it comes within ~500px of the viewport. Keeps memory bounded for
     100+ page PDFs.
  4. Zoom = scale multiplier on the fit-width baseline. Changing zoom
     invalidates all rendered canvases; tokens prevent stale renders.
  5. Active page counter updates as the user scrolls.

Why not use PDF.js's bundled viewer.html? It's a full UI with its own
toolbar, download/print buttons, and would require iframing (back to square
one). This is a minimal canvas-only renderer with our own chrome.
============================================================================
{% endcomment %}
<script>
(function () {
    'use strict';

    var PDFJS_WORKER_SRC      = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var OBSERVER_ROOT_MARGIN  = '500px';
    var ZOOM_STEP = 0.25, ZOOM_MIN = 0.5, ZOOM_MAX = 3.0;

    // -- DOM handles -------------------------------------------------------
    var root         = document.getElementById('unmad-reader-root');
    var statusEl     = document.getElementById('pdf-status');
    var statusTextEl = document.getElementById('pdf-status-text');
    var errorEl      = document.getElementById('pdf-error');
    var errorTextEl  = document.getElementById('pdf-error-text');
    var containerEl  = document.getElementById('pdf-container');
    var pageCurEl    = document.getElementById('pdf-page-current');
    var pageTotalEl  = document.getElementById('pdf-page-total');
    var zoomInBtn    = document.getElementById('pdf-zoom-in');
    var zoomOutBtn   = document.getElementById('pdf-zoom-out');
    var zoomResetBtn = document.getElementById('pdf-zoom-reset');

    // Append ?client=pdfjs so the server can disguise the response as a generic
    // binary stream (Content-Type: application/octet-stream + filename=stream.dat).
    // This slips past download managers like IDM that sniff application/pdf
    // responses and hijack them. Escape-hatch links elsewhere on the page use
    // the clean URL so the native browser viewer still works for direct nav.
    var PDF_URL = root.dataset.pdfUrl + '?client=pdfjs';

    if (typeof pdfjsLib === 'undefined') {
        showError('Reader library failed to load. Check your network / ad-blocker.');
        return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_SRC;

    // -- State -------------------------------------------------------------
    var pdfDoc        = null;
    var slots         = [];
    var baseScale     = 1.0;
    var zoomFactor    = 1.0;
    var observer      = null;
    var renderedPages = new Set();
    var renderTokens  = new Map();

    function setStatusText(msg) { statusTextEl.textContent = msg; }

    function showError(msg) {
        statusEl.classList.add('hidden');
        containerEl.classList.add('hidden');
        if (msg) errorTextEl.textContent = msg;
        errorEl.classList.remove('hidden');
    }

    function enableZoomControls() {
        [zoomInBtn, zoomOutBtn, zoomResetBtn].forEach(function (b) { b.disabled = false; });
    }

    // -- Kick off document load -------------------------------------------
    // The server returns a Base64-in-JSON envelope ({"pdf_data": "..."})
    // instead of raw PDF bytes -- this is what defeats IDM's heuristic body
    // sniffing (see IssuePdfView docstring for the full rationale). We have
    // to fetch + decode it ourselves and hand PDF.js a Uint8Array via the
    // `data:` option, since `url:` mode would expect raw PDF bytes.
    fetchAndDecodePdf(PDF_URL)
        .then(function (bytes) {
            setStatusText('Parsing PDF\u2026');
            return pdfjsLib.getDocument({ data: bytes }).promise;
        })
        .then(onDocumentLoaded)
        .catch(function (err) {
            console.error('[unmad-reader] PDF load failed:', err);
            showError();
        });

    /**
     * Download the XOR-masked PDF and reverse the mask in place, returning
     * a Uint8Array of clean bytes ready for PDF.js's getDocument({data:}).
     *
     * Wire format: octet-stream where each byte has been XOR'd with
     * PDF_XOR_KEY (must match server-side apps/magazines/views.py).
     *
     * Streams the response with progress reporting when the browser
     * supports ReadableStream + Content-Length is present; falls back to
     * res.arrayBuffer() otherwise (no progress %, but still works).
     */
    var PDF_XOR_KEY = 0xAA;

    function fetchAndDecodePdf(url) {
        setStatusText('Downloading PDF\u2026');
        return fetch(url, { credentials: 'include' }).then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var total = parseInt(res.headers.get('Content-Length') || '0', 10);
            if (total > 0 && res.body && typeof res.body.getReader === 'function') {
                return readStreamWithProgress(res.body, total);
            }
            return res.arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
        }).then(function (bytes) {
            setStatusText('Decoding PDF\u2026');
            // XOR-unmask in place. The server XOR'd each byte with the same
            // key before sending; XOR is symmetric so applying the same key
            // again restores the original bytes. ~50-100 ms for a 50 MB PDF
            // and zero extra allocation -- we operate on the buffer we
            // already own from the fetch response.
            for (var i = 0; i < bytes.length; i++) bytes[i] ^= PDF_XOR_KEY;
            return bytes;
        });
    }

    function readStreamWithProgress(body, total) {
        // Pre-allocate the full buffer up front (we know the size from
        // Content-Length). This avoids a chunks-array + concat copy phase
        // and keeps peak memory at exactly 1x file size.
        var reader = body.getReader();
        var buf    = new Uint8Array(total);
        var off    = 0;
        function pump() {
            return reader.read().then(function (r) {
                if (r.done) return buf;
                buf.set(r.value, off);
                off += r.value.length;
                setStatusText('Downloading PDF\u2026 ' +
                    Math.round(100 * off / total) + '%');
                return pump();
            });
        }
        return pump();
    }

    // -- Document loaded: build the page slots ----------------------------
    function onDocumentLoaded(doc) {
        pdfDoc = doc;
        pageTotalEl.textContent = String(doc.numPages);
        setStatusText('Preparing ' + doc.numPages + ' page' + (doc.numPages === 1 ? '' : 's') + '\u2026');

        return doc.getPage(1).then(function (firstPage) {
            // We assume uniform page size (typical for magazines). Mixed-size
            // docs still render each canvas at its own page's correct viewport;
            // only the slot placeholder aspect-ratio would be slightly off.
            var unscaled = firstPage.getViewport({ scale: 1 });

            // Phase 1: place all slots with aspect-ratio so the scrollbar
            // settles at its final length immediately (no layout-shift jank).
            var frag = document.createDocumentFragment();
            for (var i = 1; i <= doc.numPages; i++) {
                var slot = document.createElement('div');
                slot.className = 'pdf-page-slot relative bg-white shadow-sm mx-auto';
                slot.style.aspectRatio = unscaled.width + ' / ' + unscaled.height;
                slot.style.maxWidth = '100%';
                slot.dataset.pageNum = String(i);

                var placeholder = document.createElement('div');
                placeholder.className = 'absolute inset-0 flex items-center justify-center text-xs text-slate-400';
                placeholder.textContent = 'Page ' + i;
                slot.appendChild(placeholder);

                frag.appendChild(slot);
                slots.push(slot);
            }
            containerEl.appendChild(frag);

            statusEl.classList.add('hidden');
            containerEl.classList.remove('hidden');

            // Phase 2: NOW that slot[0] has been laid out, derive baseScale
            // from its actual rendered CSS-pixel width. This guarantees that
            // baseScale * unscaled.width == slot.width *exactly*, so each
            // canvas's CSS pixel size will match its slot dimensions with no
            // fractional rounding -- a prerequisite for crisp Hi-DPI output.
            baseScale = computeFitWidthScale(unscaled.width);

            // Lazy-render via IntersectionObserver.
            observer = new IntersectionObserver(onSlotsIntersect, {
                root: null,
                rootMargin: OBSERVER_ROOT_MARGIN,
                threshold: 0.01,
            });
            slots.forEach(function (s) { observer.observe(s); });

            setupPageCounter();

            enableZoomControls();
            zoomInBtn.addEventListener('click',    function () { applyZoom(zoomFactor + ZOOM_STEP); });
            zoomOutBtn.addEventListener('click',   function () { applyZoom(zoomFactor - ZOOM_STEP); });
            zoomResetBtn.addEventListener('click', function () { applyZoom(1.0); });

            window.addEventListener('resize', debounce(handleResize, 150));
        });
    }

    // -- Lazy rendering ---------------------------------------------------
    function onSlotsIntersect(entries) {
        entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            var num = parseInt(entry.target.dataset.pageNum, 10);
            if (!renderedPages.has(num)) {
                renderPage(num).catch(function (err) {
                    console.warn('[unmad-reader] Page ' + num + ' render failed:', err);
                });
            }
        });
    }

    function renderPage(num) {
        if (!pdfDoc) return Promise.resolve();
        var slot = slots[num - 1];
        if (!slot) return Promise.resolve();

        // Token-based cancellation: if zoom changes mid-render, the token
        // for this page moves on and this render result gets discarded.
        var myToken = {};
        renderTokens.set(num, myToken);

        return pdfDoc.getPage(num).then(function (page) {
            // ----- Hi-DPI rendering, the textbook PDF.js way -----
            //
            // 1. `viewport` represents the page in CSS pixels -- this is the
            //    size the canvas will OCCUPY in the layout.
            // 2. `outputScale` (= devicePixelRatio) is how many DEVICE pixels
            //    we paint per CSS pixel. On a retina display this is 2; on
            //    Windows zoom 150% it's 1.5; on standard screens it's 1.
            // 3. canvas.width/height = device-pixel resolution (intrinsic).
            //    canvas.style.width/height = CSS-pixel size (display).
            //    The browser CSS-downscales 2:1 against the device pixel grid,
            //    which is the exact scenario where downscaling stays crisp.
            // 4. The `transform` parameter tells PDF.js to scale its drawing
            //    operations up by outputScale, so the page actually paints to
            //    the full device-pixel resolution rather than the CSS-pixel
            //    one. Equivalent to baking outputScale into viewport.scale,
            //    but cleaner because `viewport` stays aligned with layout.
            //
            // The previous version set canvas.style.width = '100%', which made
            // the browser compute the CSS pixel width from the slot's layout
            // (often a non-integer value). Downscaling 1600px-intrinsic into
            // a 768.4px CSS box does not align to the device-pixel grid and
            // smears every glyph through bilinear filtering. Explicit pixel
            // sizing fixes that.
            var cssScale    = baseScale * zoomFactor;
            var viewport    = page.getViewport({ scale: cssScale });
            // Force >= 2.5x supersampling so standard-DPI (1080p) monitors
            // get crystal-sharp text -- on those screens devicePixelRatio is
            // 1, which would otherwise leave us with raw page-resolution
            // canvases that the browser blurs through bilinear filtering.
            // Cost: a fit-width canvas at 2.5x is ~6.25x more pixels than
            // 1x, ~40MB per canvas at letter size. The IntersectionObserver
            // lazy-render keeps peak memory bounded to the few pages near
            // the viewport; if you see canvas-size errors on low-end Android,
            // drop this floor to 2.0 -- you keep most of the visual gain at
            // ~64% of the memory cost.
            var outputScale = Math.max(window.devicePixelRatio || 1, 2.5);

            var canvas = document.createElement('canvas');
            canvas.width  = Math.floor(viewport.width  * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.width  = Math.floor(viewport.width)  + 'px';
            canvas.style.height = Math.floor(viewport.height) + 'px';
            canvas.style.maxWidth = '100%';
            canvas.style.display  = 'block';
            canvas.style.margin   = '0 auto';

            var ctx = canvas.getContext('2d', { alpha: false });

            // outputScale === 1 -> pass null so PDF.js short-circuits the
            // matrix multiply (tiny perf win on standard-DPI screens).
            var transform = outputScale !== 1
                ? [outputScale, 0, 0, outputScale, 0, 0]
                : null;

            return page.render({
                canvasContext: ctx,
                viewport: viewport,
                transform: transform,
            }).promise.then(function () {
                // If we got pre-empted by a zoom, drop this result.
                if (renderTokens.get(num) !== myToken) return;
                slot.innerHTML = '';
                slot.appendChild(canvas);
                renderedPages.add(num);
            });
        });
    }

    // -- Zoom -------------------------------------------------------------
    function applyZoom(newFactor) {
        newFactor = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newFactor));
        if (Math.abs(newFactor - zoomFactor) < 0.01) return;
        zoomFactor = newFactor;

        // Invalidate all rendered pages. Tokens will prevent stale renders.
        renderedPages.clear();
        renderTokens.clear();
        slots.forEach(function (slot) {
            slot.innerHTML =
                '<div class="absolute inset-0 flex items-center justify-center text-xs text-slate-400">' +
                'Page ' + slot.dataset.pageNum +
                '</div>';
        });

        // Re-observe: currently-visible slots fire their intersection callback
        // on re-observe, so pages in view get redrawn first.
        if (observer) {
            slots.forEach(function (s) { observer.unobserve(s); });
            slots.forEach(function (s) { observer.observe(s); });
        }
    }

    function handleResize() {
        if (!pdfDoc) return;
        pdfDoc.getPage(1).then(function (p) {
            var unscaled = p.getViewport({ scale: 1 });
            var newBase  = computeFitWidthScale(unscaled.width);
            // Re-render only if the change is >= 1 CSS pixel of slot width.
            // Anything smaller is below visual perception and would just churn.
            if (Math.abs(newBase - baseScale) * unscaled.width < 1) return;
            baseScale = newBase;
            // Force re-render of all pages at the new scale. We can't reuse
            // applyZoom() here because zoomFactor itself didn't change -- we
            // need to invalidate the canvases directly.
            renderedPages.clear();
            renderTokens.clear();
            slots.forEach(function (slot) {
                slot.innerHTML =
                    '<div class="absolute inset-0 flex items-center justify-center text-xs text-slate-400">' +
                    'Page ' + slot.dataset.pageNum +
                    '</div>';
            });
            if (observer) {
                slots.forEach(function (s) { observer.unobserve(s); });
                slots.forEach(function (s) { observer.observe(s); });
            }
        });
    }

    function computeFitWidthScale(unscaledWidth) {
        // Prefer the actual measured CSS-pixel width of slot[0] -- this is
        // the value the canvas will need to match for pixel-perfect Hi-DPI.
        // Falls back to a clientWidth-based estimate before any slot exists
        // (initial scale, pre-placement).
        if (slots.length > 0) {
            var measured = slots[0].getBoundingClientRect().width;
            if (measured > 0) return measured / unscaledWidth;
        }
        // p-2 (8px) on small screens, p-4 (16px) on sm+ -- subtract whichever
        // applies so we don't overshoot and trigger horizontal scroll.
        var sm  = window.matchMedia && window.matchMedia('(min-width: 640px)').matches;
        var pad = sm ? 32 : 16;
        var avail = Math.max(280, containerEl.clientWidth - pad);
        return avail / unscaledWidth;
    }

    // -- Page counter tracking --------------------------------------------
    function setupPageCounter() {
        if (!('IntersectionObserver' in window)) return;
        var counter = new IntersectionObserver(function () {
            // On any intersection change, recompute the most-visible slot.
            var top = { num: 1, ratio: 0 };
            for (var i = 0; i < slots.length; i++) {
                var slot = slots[i];
                var rect = slot.getBoundingClientRect();
                var visH = Math.max(0, Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0));
                var ratio = visH / Math.max(1, rect.height);
                if (ratio > top.ratio) {
                    top = { num: parseInt(slot.dataset.pageNum, 10), ratio: ratio };
                }
            }
            pageCurEl.textContent = String(top.num);
        }, { threshold: [0, 0.25, 0.5, 0.75, 1] });
        slots.forEach(function (s) { counter.observe(s); });
    }

    // -- Utils ------------------------------------------------------------
    function debounce(fn, ms) {
        var t;
        return function () {
            clearTimeout(t);
            var args = arguments;
            t = setTimeout(function () { fn.apply(null, args); }, ms);
        };
    }
})();
</script>

{% endblock %}
