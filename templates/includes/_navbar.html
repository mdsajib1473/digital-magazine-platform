{% load static %}
<nav class="sticky top-0 z-50 bg-[#bc1d23] shadow-lg">
    <div class="mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Logo -->
            <div class="flex-shrink-0">
                <a href="{% url 'home' %}" class="flex items-center">
                    <img src="{% static 'images/main_logo.png' %}" alt="Unmad BD" class="h-14 w-auto">
                </a>
            </div>

            <!-- Desktop Navigation Links -->
            <div class="hidden md:flex items-center space-x-8">
                <a href="{% url 'home' %}" class="text-white text-sm font-bold uppercase tracking-wider hover:text-red-200 transition">
                    All Issues
                </a>
                <a href="#" class="text-white text-sm font-bold uppercase tracking-wider hover:text-red-200 transition">
                    Digital Archive
                </a>
                <a href="#" class="text-white text-sm font-bold uppercase tracking-wider hover:text-red-200 transition">
                    About
                </a>
            </div>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <div class="relative w-full">
                    <input type="text"
                           placeholder="Search issues..."
                           class="w-full px-4 py-2 pl-10 rounded-md text-sm bg-white/10 border border-white/20 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white/50 focus:bg-white/20 transition">
                    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 h-4 w-4 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
            </div>

            <!-- Auth Buttons -->
            <div class="hidden md:flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <a href="{% url 'library' %}" class="text-white text-sm font-semibold hover:text-red-200 transition">
                        My Library
                    </a>
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="px-4 py-2 text-sm font-semibold text-[#bc1d23] bg-white rounded-md hover:bg-red-100 transition">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="text-white text-sm font-semibold hover:text-red-200 transition">
                        Login
                    </a>
                    <a href="{% url 'signup' %}" class="px-4 py-2 text-sm font-semibold text-[#bc1d23] bg-white rounded-md hover:bg-red-100 transition">
                        Register
                    </a>
                {% endif %}
            </div>

            <!-- Mobile menu button -->
            <div class="md:hidden flex items-center">
                <button type="button" class="text-white hover:text-red-200 focus:outline-none" id="mobile-menu-button">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile menu (hidden by default) -->
    <div class="md:hidden hidden bg-[#a3161b]" id="mobile-menu">
        <div class="px-2 pt-2 pb-3 space-y-1">
            <a href="{% url 'home' %}" class="block px-3 py-2 text-white text-sm font-bold uppercase tracking-wider hover:bg-white/10 rounded-md">
                All Issues
            </a>
            <a href="#" class="block px-3 py-2 text-white text-sm font-bold uppercase tracking-wider hover:bg-white/10 rounded-md">
                Digital Archive
            </a>
            <a href="#" class="block px-3 py-2 text-white text-sm font-bold uppercase tracking-wider hover:bg-white/10 rounded-md">
                About
            </a>
            <!-- Mobile Search -->
            <div class="px-3 py-2">
                <input type="text"
                       placeholder="Search issues..."
                       class="w-full px-4 py-2 rounded-md text-sm bg-white/10 border border-white/20 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white/50">
            </div>
            <!-- Mobile Auth -->
            {% if user.is_authenticated %}
                <a href="{% url 'library' %}" class="block px-3 py-2 text-white text-sm font-semibold hover:bg-white/10 rounded-md">
                    My Library
                </a>
                <form action="{% url 'logout' %}" method="post" class="px-3 py-2">
                    {% csrf_token %}
                    <button type="submit" class="w-full text-left text-white text-sm font-semibold hover:bg-white/10 rounded-md py-2">
                        Logout
                    </button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="block px-3 py-2 text-white text-sm font-semibold hover:bg-white/10 rounded-md">
                    Login
                </a>
                <a href="{% url 'signup' %}" class="block px-3 py-2 text-white text-sm font-semibold hover:bg-white/10 rounded-md">
                    Register
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<script>
    // Simple mobile menu toggle
    document.getElementById('mobile-menu-button').addEventListener('click', function() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    });
</script>
